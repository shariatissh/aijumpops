[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aijumpops"
version = "1.0.0"
description = "AiJumpOps - Universal AI-Native JumpServer Bastion / PAM Copilot (MCP Server, Agent Skill & Safe CLI Engine)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = [
    "jumpserver",
    "bastion",
    "pam",
    "aiops",
    "mcp",
    "model-context-protocol",
    "devops",
    "secops",
    "ssh",
    "rdp",
    "claude-skill",
    "opencode",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/shariatissh/aijumpops"
Repository = "https://github.com/shariatissh/aijumpops"
Issues = "https://github.com/shariatissh/aijumpops/issues"

[project.scripts]
jmsctl = "jmsctl:main"
aijumpops = "jmsctl:main"
aijumpops-mcp = "aijumpops_mcp:main"

[tool.setuptools]
py-modules = ["jmsctl", "aijumpops_mcp"]
